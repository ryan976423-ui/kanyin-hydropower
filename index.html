
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kanyin Hydropower</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #eef3f9;
    color: #172c46;
}

header {
    background: #102c4c;
    color: white;
    padding: 25px;
    text-align: center;
    box-shadow: 0 3px 12px #0002;
}

header h1 {
    letter-spacing: 2px;
    font-size: 25px;
}

header p {
    color: #a9c9e9;
    margin-top: 8px;
}

.login-screen {
    min-height: 85vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.login-box {
    background: white;
    padding: 35px;
    border-radius: 15px;
    width: 100%;
    max-width: 380px;
    text-align: center;
    box-shadow: 0 5px 25px #102c4c20;
}

.login-box h2 {
    margin-bottom: 25px;
}

input[type="password"] {
    width: 100%;
    padding: 14px;
    border: 1px solid #ccd6e2;
    border-radius: 8px;
    margin-bottom: 15px;
    font-size: 16px;
}

button {
    cursor: pointer;
    border: none;
    border-radius: 8px;
    padding: 12px 18px;
    font-size: 15px;
}

.login-btn, .add-btn {
    background: #1265ad;
    color: white;
    width: 100%;
}

button:hover {
    opacity: 0.85;
}

#message {
    color: #d33;
    margin-top: 12px;
}

#dashboard {
    display: none;
    padding: 25px;
    max-width: 1100px;
    margin: auto;
}

.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 25px;
}

.back-btn {
    background: #dce8f4;
    color: #173e65;
}

.logout-btn {
    background: #b83c3c;
    color: white;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
    gap: 18px;
}

.card {
    background: white;
    border-radius: 12px;
    padding: 25px 12px;
    text-align: center;
    cursor: pointer;
    box-shadow: 0 3px 12px #00000010;
    border: 1px solid #e1e9f1;
    transition: 0.2s;
}

.card:hover {
    transform: translateY(-4px);
    border-color: #1265ad;
}

.card .icon {
    font-size: 36px;
    margin-bottom: 12px;
}

.card h3 {
    color: #173e65;
}

.card p {
    color: #718096;
    font-size: 12px;
    margin-top: 7px;
}

.file-area {
    background: white;
    padding: 22px;
    border-radius: 12px;
    margin-top: 20px;
}

.file-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 14px 5px;
    border-bottom: 1px solid #e5eaf0;
    flex-wrap: wrap;
}

.file-name {
    overflow-wrap: anywhere;
    flex: 1;
}

.file-actions {
    display: flex;
    gap: 7px;
}

.open-btn {
    background: #1265ad;
    color: white;
}

.delete-btn {
    background: #f8dddd;
    color: #a22;
}

.empty {
    text-align: center;
    color: #8795a5;
    padding: 35px 10px;
}

#fileInput {
    display: none;
}

@media(max-width:500px) {
    header h1 { font-size: 19px; }
    #dashboard { padding: 15px; }
    .file-item { align-items: flex-start; }
}
</style>
</head>

<body>

<header>
    <h1>KANYIN HYDROPOWER</h1>
    <p>Document Management System</p>
</header>

<!-- LOGIN -->
<section class="login-screen" id="loginScreen">
    <div class="login-box">
        <h2>🔐 Welcome</h2>
        <p style="margin-bottom:20px;color:#718096">
            Enter Password to Continue
        </p>

        <input type="password" id="password"
        placeholder="Enter Password">

        <button class="login-btn" onclick="login()">
            LOGIN
        </button>

        <p id="message"></p>
    </div>
</section>

<!-- DASHBOARD -->
<main id="dashboard">

    <div class="top-bar">
        <div>
            <h2 id="pageTitle">Select Year</h2>
            <p id="pageSubtitle">Choose a year to continue</p>
        </div>

        <div style="display:flex;gap:8px">
            <button class="back-btn" id="backBtn"
            onclick="goBack()" style="display:none">
                ← Back
            </button>

            <button class="logout-btn" onclick="logout()">
                Logout
            </button>
        </div>
    </div>

    <div class="grid" id="content"></div>

    <section class="file-area" id="fileArea"
    style="display:none">

        <div style="display:flex;justify-content:space-between;
        align-items:center;gap:12px;flex-wrap:wrap">

            <h3>📁 Stored Documents</h3>

            <button class="add-btn" style="width:auto"
            onclick="document.getElementById('fileInput').click()">
                + Add Files
            </button>

        </div>

        <input type="file" id="fileInput" multiple
        onchange="uploadFiles(event)">

        <div id="fileList"></div>
    </section>

</main>

<script>

// PASSWORD
const PASSWORD = "kanyin2024";

// YEARS AND MONTHS
const years = ["2026", "2027", "2028"];

const months = [
    "January", "February", "March",
    "April", "May", "June",
    "July", "August", "September",
    "October", "November", "December"
];

// CURRENT PAGE
let currentYear = "";
let currentMonth = "";

// DATABASE
let db;

const request = indexedDB.open("KanyinHydropowerDB", 1);

request.onupgradeneeded = function(event) {
    db = event.target.result;

    if (!db.objectStoreNames.contains("documents")) {
        db.createObjectStore("documents", {
            keyPath: "id",
            autoIncrement: true
        });
    }
};

request.onsuccess = function(event) {
    db = event.target.result;
};

request.onerror = function() {
    alert("Database Error!");
};

// LOGIN
function login() {
    const pass = document.getElementById("password").value;

    if (pass === PASSWORD) {
        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("dashboard").style.display = "block";

        showYears();
    } else {
        document.getElementById("message").textContent =
            "Incorrect Password!";
    }
}

document.getElementById("password").addEventListener("keydown", function(e) {
    if (e.key === "Enter") login();
});

// LOGOUT
function logout() {
    document.getElementById("dashboard").style.display = "none";
    document.getElementById("loginScreen").style.display = "flex";

    document.getElementById("password").value = "";
    currentYear = "";
    currentMonth = "";
}

// SHOW YEARS
function showYears() {
    currentYear = "";
    currentMonth = "";

    document.getElementById("pageTitle").textContent = "Select Year";
    document.getElementById("pageSubtitle").textContent =
        "Choose a year to continue";

    document.getElementById("backBtn").style.display = "none";
    document.getElementById("fileArea").style.display = "none";

    const content = document.getElementById("content");
    content.innerHTML = "";

    years.forEach(year => {
        const card = document.createElement("div");
        card.className = "card";

        const icon = document.createElement("div");
        icon.className = "icon";
        icon.textContent = "📁";

        const title = document.createElement("h3");
        title.textContent = year;

        const desc = document.createElement("p");
        desc.textContent = "Open Year";

        card.append(icon, title, desc);
        card.onclick = () => showMonths(year);

        content.appendChild(card);
    });
}

// SHOW MONTHS
function showMonths(year) {
    currentYear = year;
    currentMonth = "";

    document.getElementById("pageTitle").textContent = year;
    document.getElementById("pageSubtitle").textContent =
        "Select a month";

    document.getElementById("backBtn").style.display = "block";
    document.getElementById("fileArea").style.display = "none";

    const content = document.getElementById("content");
    content.innerHTML = "";

    months.forEach((month, index) => {
        const card = document.createElement("div");
        card.className = "card";

        const icon = document.createElement("div");
        icon.className = "icon";
        icon.textContent = "📂";

        const title = document.createElement("h3");
        title.textContent = month;

        const desc = document.createElement("p");
        desc.textContent = year + " / " + String(index + 1).padStart(2, "0");

        card.append(icon, title, desc);
        card.onclick = () => showFiles(month);

        content.appendChild(card);
    });
}

// SHOW FILES
function showFiles(month) {
    currentMonth = month;

    document.getElementById("pageTitle").textContent =
        currentYear + " / " + month;

    document.getElementById("pageSubtitle").textContent =
        "Manage your documents";

    document.getElementById("content").innerHTML = "";
    document.getElementById("fileArea").style.display = "block";

    loadFiles();
}

// UPLOAD FILES
function uploadFiles(event) {
    const files = Array.from(event.target.files);

    if (!db) {
        alert("Database is not ready. Please try again.");
        return;
    }

    if (!currentYear || !currentMonth) return;

    const tx = db.transaction("documents", "readwrite");
    const store = tx.objectStore("documents");

    files.forEach(file => {
        store.add({
            name: file.name,
            type: file.type,
            size: file.size,
            year: currentYear,
            month: currentMonth,
            date: new Date().toLocaleString(),
            data: file
        });
    });

    tx.oncomplete = function() {
        event.target.value = "";
        loadFiles();
    };

    tx.onerror = function() {
        alert("Upload failed. Storage may be full.");
    };
}

// LOAD FILES
function loadFiles() {
    if (!db) return;

    const tx = db.transaction("documents", "readonly");
    const store = tx.objectStore("documents");

    const request = store.getAll();

    request.onsuccess = function() {
        const files = request.result.filter(file =>
            file.year === currentYear &&
            file.month === currentMonth
        );

        const list = document.getElementById("fileList");
        list.innerHTML = "";

        if (files.length === 0) {
            list.innerHTML =
                '<div class="empty">No files yet. Click Add Files to upload.</div>';
            return;
        }

        files.forEach(file => {
            const item = document.createElement("div");
            item.className = "file-item";

            const name = document.createElement("div");
            name.className = "file-name";

            const fileIcon = document.createElement("span");
            fileIcon.textContent = "📄 ";

            const fileName = document.createElement("strong");
            fileName.textContent = file.name;

            const date = document.createElement("small");
            date.textContent = " (" + file.date + ")";

            name.append(fileIcon, fileName, date);

            const actions = document.createElement("div");
            actions.className = "file-actions";

            const open = document.createElement("button");
            open.className = "open-btn";
            open.textContent = "Open";
            open.onclick = () => openFile(file);

            const remove = document.createElement("button");
            remove.className = "delete-btn";
            remove.textContent = "Delete";
            remove.onclick = () => deleteFile(file.id);

            actions.append(open, remove);
            item.append(name, actions);

            list.appendChild(item);
        });
    };
}

// OPEN FILE
function openFile(file) {
    const url = URL.createObjectURL(file.data);

    const link = document.createElement("a");
    link.href = url;
    link.download = file.name;
    link.target = "_blank";

    document.body.appendChild(link);
    link.click();
    link.remove();

    setTimeout(() => URL.revokeObjectURL(url), 60000);
}

// DELETE FILE
function deleteFile(id) {
    if (!confirm("Are you sure you want to delete this file?")) {
        return;
    }

    const tx = db.transaction("documents", "readwrite");
    tx.objectStore("documents").delete(id);

    tx.oncomplete = loadFiles;
}

// BACK BUTTON
function goBack() {
    if (currentMonth) {
        currentMonth = "";
        showMonths(currentYear);
    } else {
        showYears();
    }
}

</script>

</body>
</html>
